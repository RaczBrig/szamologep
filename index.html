<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="keywords" content="szamologep">
    <meta http-equiv="Content-Type" content="text/html;charset=UTF-8">
    <link rel="stylesheet" href="stilus.css">
    <script type="module" src="index.js"></script>
    <title>Számológép - Rácz Brigitta</title>
</head>

<body>
    <main>
        <div class="fejlec">
            <h1>Számológép</h1>
        </div>

        <input class="text" type="text">

        <div class="gombok">
            <button id="het" class="het">7</button>
            <button id="nyolc" class="nyolc">8</button>
            <button id="kilenc" class="kilenc">9</button>
            <button id="perjel" class="perjel">/</button>

            <button id="negy" class="negy">4</button>
            <button id="ot" class="ot">5</button>
            <button id="hat" class="hat">6</button>
            <button id="csillag" class="csillag">*</button>

            <button id="egy" class="egy">1</button>
            <button id="ketto" class="ketto">2</button>
            <button id="harom" class="harom">3</button>
            <button id="minusz" class="minusz">-</button>

            <button id="c" class="c">C</button>
            <button id="nulla" class="nulla">0</button>
            <button id="egyenlo" class="egyenlo">=</button>
            <button id="plusz" class="plusz">+</button>
        </div>
    </main>
</body>
</html>
